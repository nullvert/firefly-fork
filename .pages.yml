## 7. Интерактивные диаграммы

### Mermaid: Диаграмма последовательности с масштабированием

Диаграммы поддерживают встроенные кнопки панорамирования и зума (Pan/Zoom):

```mermaid
sequenceDiagram
    autonumber
    actor User as Пользователь
    participant Client as Браузер (Svelte 5)
    participant Edge as CDN / Cloudflare
    participant Server as Astro Static Core

    User->>Client: Переход на страницу блога
    Client->>Edge: HTTP GET /posts/markdown-tutorial/
    Edge-->>Client: Сжатый HTML + CSS + WebP LQIP
    Client->>Client: Гидратация интерактивных островов
    Client->>Edge: Фоновая загрузка поискового индекса Pagefind
    Note over Client,Edge: Полная интерактивность достигнута за < 100мс
```

### Mermaid: Git Graph ветвления репозитория

```mermaid
gitGraph
    commit id: "init"
    commit id: "v1.0" tag: "v1.0"
    branch dev
    checkout dev
    commit id: "feat: add katex"
    commit id: "feat: mdx support"
    checkout main
    merge dev id: "merge dev"
    commit id: "release v2.0" tag: "v2.0"
```

### PlantUML: Архитектурные компоненты

```plantuml
@startuml
skinparam componentStyle uml2
skinparam roundcorner 8

package "Firefly Engine" {
  [Astro 5 Core] as Astro
  [Content Collections] as Collections
  [Expressive Code] as Code
  [KaTeX & Mermaid] as MathDiagrams
  [Pagefind Indexer] as Search
}

database "Markdown / MDX Posts" {
  [Local Source Files] as Source
}

Source --> Collections
Collections --> Astro
Astro --> Code
Astro --> MathDiagrams
Astro --> Search
@enduml
```

