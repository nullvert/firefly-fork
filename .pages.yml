### Группа вкладок с кодом (Code Groups)

:::code-group
```go [Go Worker Pool]
package main

import (
	"context"
	"fmt"
	"sync"
)

func processTasks(ctx context.Context, tasks []int) <-chan int {
	out := make(chan int)
	var wg sync.WaitGroup

	for _, task := range tasks {
		wg.Add(1)
		go func(t int) {
			defer wg.Done()
			select {
			case <-ctx.Done():
				return
			case out <- t * t:
			}
		}(task)
	}

	go func() {
		wg.Wait()
		close(out)
	}()
	return out
}
```

```rust [Rust Tokio Actor]
use tokio::sync::mpsc;

enum Command {
    Increment { amount: u32 },
    Get { responder: tokio::sync::oneshot::Sender<u32> },
}

async fn run_actor(mut rx: mpsc::Receiver<Command>) {
    let mut state = 0u32;
    while let Some(cmd) = rx.recv().await {
        match cmd {
            Command::Increment { amount } => state += amount,
            Command::Get { responder } => {
                let _ = responder.send(state);
            }
        }
    }
}
```

```sql [PostgreSQL Query]
WITH ranked_posts AS (
    SELECT 
        p.id,
        p.title,
        p.category,
        p.created_at,
        COUNT(c.id) AS comments_count,
        DENSE_RANK() OVER (PARTITION BY p.category ORDER BY COUNT(c.id) DESC) as rank
    FROM posts p
    LEFT JOIN comments c ON p.id = c.post_id
    GROUP BY p.id
)
SELECT * FROM ranked_posts WHERE rank <= 3 ORDER BY category, rank;
```
:::

