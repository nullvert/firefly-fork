## 2. Цитаты и эпиграфы

Стандартные цитаты Markdown поддерживают многострочный текст, указание авторства и вложенные уровни:

> Программирование — это искусство говорить другому человеку, что именно должен сделать компьютер.
>
> — *Дональд Кнут (Donald Knuth)*

Вложенная цитата для диалогов или обсуждений:

> Основное утверждение архитектуры микросервисов:
>
>> Делайте сервисы слабо связанными и обладающими высокой связностью (high cohesion, low coupling).
>> — *Мартин Фаулер*
>
> Этот принцип позволяет масштабировать команды независимо.

