## 1. Типографика и форматирование текста

Тема поддерживает полный спектр типографических стилей для структурирования информации:

# Заголовок первого уровня (H1)
## Заголовок второго уровня (H2)
### Заголовок третьего уровня (H3)
#### Заголовок четвертого уровня (H4)
##### Заголовок пятого уровня (H5)
###### Заголовок шестого уровня (H6)

### Стили начертания и акценты

- **Полужирный текст** (`**bold**` или `__bold__`)
- *Курсивный текст* (`*italic*` или `_italic_`)
- ***Полужирный курсив*** (`***bold italic***`)
- ~~Зачёркнутый текст~~ (`~~strikethrough~~`)
- `Встроенный код` (``inline code``)
- Выделение маркером: <mark>ключевая мысль или важный фрагмент</mark> (`<mark>текст</mark>`)
- Горячие клавиши и сочетания клавиатуры: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd> или <kbd>⌘</kbd> + <kbd>K</kbd>
- Индексы и формулы: H<sub>2</sub>O (`H<sub>2</sub>O`), 2<sup>10</sup> = 1024 (`2<sup>10</sup>`)
- Аббревиатуры с подсказкой: <abbr title="Application Programming Interface">API</abbr>, <abbr title="Static Site Generator">SSG</abbr>

### Спойлеры

Для сокрытия сюжетных поворотов, ответов на загадки или служебных деталей используется синтаксис директив `:spoiler[текст]`:

- Результат матча: :spoiler[Команда победила в овертайме со счётом 3:2]!
- Секретный пароль от архива: :spoiler[`firefly-2026-secure`]

