## 5. Подсветка кода (Expressive Code)

Блоки кода работают на движке **Expressive Code**. Поддерживаются имена файлов, иконки языков, подсветка строк, маркеры изменений и сворачивание фрагментов.

### TypeScript: Клиент с повторными запросами (Retry Backoff)

```typescript title="src/utils/fetchWithRetry.ts" {4-6} ins={14-16} del={11}
interface RetryOptions {
  maxRetries?: number;
  backoffFactorMs?: number;
  timeoutMs?: number;
}

export async function fetchWithRetry<T>(
  endpoint: string,
  options: RetryOptions = {},
): Promise<T> {
  const { maxRetries = 3, backoffFactorMs = 400 } = options;
  // Старая реализация без обработки сбоев: const res = await fetch(endpoint);
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    try {
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error(\`HTTP \${response.status}\`);
      return (await response.json()) as T;
    } catch (error) {
      if (attempt === maxRetries) throw error;
      await new Promise((resolve) =>
        setTimeout(resolve, backoffFactorMs * 2 ** (attempt - 1)),
      );
    }
  }
  throw new Error("Недостижимая ветка retry-цикла");
}
```

### Python: Свёрнутый блок обучения нейросети

```python title="neural_net.py"
import torch
import torch.nn as nn

class TransformerBlock(nn.Module):
    def __init__(self, embed_dim: int, num_heads: int):
        super().__init__()
        self.attention = nn.MultiheadAttention(embed_dim, num_heads)
        self.norm1 = nn.LayerNorm(embed_dim)
        self.norm2 = nn.LayerNorm(embed_dim)
        self.mlp = nn.Sequential(
            nn.Linear(embed_dim, embed_dim * 4),
            nn.GELU(),
            nn.Linear(embed_dim * 4, embed_dim),
        )

    def forward(self, x):
        attn_out, _ = self.attention(x, x, x)
        x = self.norm1(x + attn_out)
        return self.norm2(x + self.mlp(x))

# [!code collapse:start]
# Свёрнутая служебная инициализация оптимизатора и загрузчика данных
device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
model = TransformerBlock(embed_dim=256, num_heads=8).to(device)
criterion = nn.CrossEntropyLoss()
optimizer = torch.optim.AdamW(model.parameters(), lr=3e-4, weight_decay=1e-2)
print(f"Модель инициализирована на устройстве: {device}")
# [!code collapse:end]
```

