## 6. Математика и формулы (KaTeX)

Тема интегрирует математический движок KaTeX с поддержкой расширения для химических формул `mhchem`.

### Уравнение Шрёдингера (квантовая механика)

$$i\hbar \frac{\partial}{\partial t}\Psi(\mathbf{r},t) = \left [ -\frac{\hbar^2}{2m}\nabla^2 + V(\mathbf{r},t) \right ] \Psi(\mathbf{r},t)$$

### Преобразование Фурье

$$F(\omega) = \int_{-\infty}^{\infty} f(t) e^{-i\omega t} dt$$

### Теорема Байеса

$$P(A|B) = \frac{P(B|A) \cdot P(A)}{P(B)}$$

### Химические уравнения (`\ce{...}`)

Термоядерная реакция синтеза дейтерия и трития:
$$\ce{^2_1H + ^3_1H -> ^4_2He + ^1_0n + 17.6 MeV}$$

Реакция нейтрализации:
$$\ce{HCl + NaOH -> NaCl + H2O}$$

Инлайн-математика также работает прямо в тексте: формула энергии $E = mc^2$, золотое сечение $\phi = \frac{1 + \sqrt{5}}{2} \approx 1.618$.

