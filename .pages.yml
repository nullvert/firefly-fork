## 11. Дополнительные возможности разметки

### Сворачиваемый блок (`<details>`)

<details>
<summary><b>Нажмите, чтобы просмотреть скрытые технические параметры</b></summary>
<br />

Здесь могут располагаться вспомогательные листинги конфигураций, расширенные логи сборки или справочные данные, которые не должны перегружать основной текст статьи:

- Среда сборки: Node.js v20+ / pnpm
- Метод сжатия скриптов: `esbuild` с флагом minify
- Время индексации Pagefind: < 0.1s
</details>

### Защита адресов электронной почты

Адреса электронной почты в ссылках автоматически кодируются в Base64 плагином `rehype-email-protection`, защищая их от парсеров спам-ботов:

- Связаться с автором: <a href="mailto:hello@example.com">hello@example.com</a>

### Внутренние вики-ссылки (Obsidian WikiLinks)

Поддерживается бесшовная навигация между материалами блога в стиле Obsidian: [[markdown-tutorial|Ссылка на данное руководство по Markdown]].

### Сноски в тексте статьи

Полноценная система сносок с двусторонними гиперссылками: Astro[^1] использует концепцию изолированных островов, а тема Firefly[^2] обеспечивает плавную навигацию через Swup.

[^1]: Astro — современный веб-фреймворк, ориентированный на максимальную производительность доставки контента.
[^2]: Firefly — элегантная тема для блога на базе Astro с адаптивным дизайном и богатым набором встроенных компонентов.
